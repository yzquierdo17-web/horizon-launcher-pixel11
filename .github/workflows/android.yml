name: Build Horizon APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets builds of main publish the APK as a Release

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradle-wrapper.jar, so install Gradle directly
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Sign with the permanent key when the HORIZON_KEYSTORE and HORIZON_KEY_PASSWORD secrets are set,
      # so every update installs over the last one and keeps your layout. Stray spaces and line breaks
      # from copy-paste are removed; if the key still can't be opened, fall back to a temporary key.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.HORIZON_KEYSTORE }}
          KEY_PW: ${{ secrets.HORIZON_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PW" ]; then
            echo "::warning::Signing secrets not set: this build uses a temporary key"
            exit 0
          fi
          PW=$(printf '%s' "$KEY_PW" | tr -d ' \r\n\t')
          echo "::add-mask::$PW"
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/horizon.jks" 2>/dev/null || true
          if keytool -list -keystore "$RUNNER_TEMP/horizon.jks" -storepass "$PW" -alias horizon >/dev/null 2>&1; then
            echo "HORIZON_KEYSTORE_PATH=$RUNNER_TEMP/horizon.jks" >> "$GITHUB_ENV"
            echo "HORIZON_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "Signing with the permanent Horizon key"
          else
            echo "::warning::Couldn't open the signing key with that password: this build uses a temporary key"
          fi

      - name: Build the APK
        run: |
          set -o pipefail
          gradle assembleRelease 2>&1 | tee build.log || {
            grep -E "^e: |error:" build.log | head -25 | while read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Builds of main also go to Releases, so this link always installs the newest version:
      # https://github.com/${{ github.repository }}/releases/latest/download/Horizon.apk
      - name: Name the APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/*.apk Horizon.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Horizon build ${{ github.run_number }}
          # What's new: shown in Horizon's update prompt.
          body: ${{ github.event.head_commit.message }}
          files: Horizon.apk
          make_latest: "true"
