name: Build Horizon APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets builds of main publish the APK as a Release

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradle-wrapper.jar, so install Gradle directly
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Sign with the permanent key when the HORIZON_KEYSTORE and HORIZON_KEY_PASSWORD secrets are set,
      # so every update installs over the last one and keeps your layout.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.HORIZON_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/horizon.jks"
            echo "HORIZON_KEYSTORE_PATH=$RUNNER_TEMP/horizon.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent Horizon key"
          else
            echo "::warning::HORIZON_KEYSTORE secret not set: this build uses a temporary key"
          fi

      - name: Build the APK
        env:
          HORIZON_KEY_PASSWORD: ${{ secrets.HORIZON_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log || {
            grep -E "^e: |error:" build.log | head -25 | while read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Builds of main also go to Releases, so this link always installs the newest version:
      # https://github.com/${{ github.repository }}/releases/latest/download/Horizon.apk
      - name: Name the APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/*.apk Horizon.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Horizon build ${{ github.run_number }}
          body: Newest build from main. On your phone, open Horizon.apk to install it.
          files: Horizon.apk
          make_latest: "true"
