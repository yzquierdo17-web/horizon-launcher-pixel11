name: Build Horizon APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets builds of main publish the APK as a Release

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradle-wrapper.jar, so install Gradle directly
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the APK
        run: gradle assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Builds of main also go to Releases, so this link always installs the newest version:
      # https://github.com/${{ github.repository }}/releases/latest/download/Horizon.apk
      - name: Name the APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/*.apk Horizon.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Horizon build ${{ github.run_number }}
          body: Newest build from main. On your phone, open Horizon.apk to install it.
          files: Horizon.apk
          make_latest: "true"
